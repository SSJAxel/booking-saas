services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_saas
      POSTGRES_USER: booking_saas
      POSTGRES_PASSWORD: booking_saas
    ports:
      - "5432:5432"
    volumes:
      - booking-saas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Catches outgoing mail locally instead of sending real emails — view them at
  # http://localhost:8025. Not used in tests (the notification listener swallows send
  # failures), only for manual verification during local development.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  booking-saas-pgdata:
