server:
  # Render (and most PaaS) inject PORT and expect the app to bind to it; 8080 stays the local default.
  port: ${PORT:8080}

spring:
  application:
    name: booking-saas
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_saas
    username: booking_saas
    password: booking_saas
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    # Dev default: MailHog (localhost:1025, no auth/TLS). For real sending — e.g. Gmail SMTP —
    # override MAIL_HOST/PORT/USERNAME/PASSWORD and flip MAIL_SMTP_AUTH/MAIL_SMTP_STARTTLS to
    # true (see README "Enviar mail real" for the Gmail App Password setup).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  booking:
    # How long a PENDING appointment waits for its deposit before it's cancelled and the slot
    # freed back up. Global for now — a real multi-tenant deployment would let each tenant tune
    # this.
    deposit-expiration-minutes: ${DEPOSIT_EXPIRATION_MINUTES:30}
    expiration-check-interval-ms: ${EXPIRATION_CHECK_INTERVAL_MS:60000}
    # How often AppointmentRetentionScheduler checks and purges expired history, for all tenants —
    # daily is plenty, this isn't holding a booking slot hostage like the deposit-expiration check.
    retention-check-interval-ms: ${RETENTION_CHECK_INTERVAL_MS:86400000}
  trial:
    # How often TrialExpirationScheduler checks for TRIAL ("Demo") tenants past their 15-day
    # window — hourly is plenty, unlike the deposit-expiration check this isn't holding a booking
    # slot hostage.
    expiration-check-interval-ms: ${TRIAL_EXPIRATION_CHECK_INTERVAL_MS:3600000}
  cors:
    # Comma-separated allow-list of frontend origins allowed to call this API from a browser
    # (the admin panel, eventually a business's own public site). No wildcard on purpose.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5180,http://localhost:5181}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-override-in-prod-min-32-bytes}
    expiration-minutes: 60
  mail:
    from: ${MAIL_FROM:no-reply@booking-saas.local}
    # Where the emailed "confirm your email" link points — the admin panel's own verification
    # page, not a backend URL, since it needs to call the API and then redirect into the app.
    verification-base-url: ${MAIL_VERIFICATION_BASE_URL:http://localhost:5180/verificar-email}
    # Where the emailed "reset your password" link points — same reasoning as verification-base-url.
    reset-password-base-url: ${MAIL_RESET_PASSWORD_BASE_URL:http://localhost:5180/restablecer-password}
    # Where the emailed "leave a review" link (post-COMPLETED, PRO/MAX only) points — same
    # reasoning as verification-base-url.
    review-base-url: ${MAIL_REVIEW_BASE_URL:http://localhost:5180/dejar-resena}
    resend:
      # When set, MailService sends via Resend's HTTPS API instead of SMTP — see its Javadoc for
      # why (some PaaS free tiers block outbound SMTP). Blank means "use SMTP", same as today.
      api-key: ${RESEND_API_KEY:}
  uploads:
    # Local-disk storage for tenant-submitted support-report images — fine for a solo-founder
    # MVP running on one instance; would need object storage (S3-like) behind a load balancer.
    dir: ${UPLOADS_DIR:./uploads}
  support:
    # Where bug-report emails (message + uploaded image) land — see SupportReportNotificationListener.
    founder-email: ${SUPPORT_FOUNDER_EMAIL:info.capibyte@gmail.com}
  rate-limit:
    # Applies to the whole unauthenticated /api/public/** surface, keyed by client IP.
    capacity: ${RATE_LIMIT_CAPACITY:30}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:30}
    refill-duration-seconds: ${RATE_LIMIT_REFILL_SECONDS:60}
    auth:
      # Much stricter than the public browsing limit above — this covers login (password
      # brute-forcing), forgot-password, and resend-verification. 10 requests per 5 minutes per IP
      # is generous for a real user mistyping their password a few times, tight for an attacker.
      capacity: ${AUTH_RATE_LIMIT_CAPACITY:10}
      refill-tokens: ${AUTH_RATE_LIMIT_REFILL_TOKENS:10}
      refill-duration-seconds: ${AUTH_RATE_LIMIT_REFILL_SECONDS:300}
  mercadopago:
    base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
    # Platform-level fallback account, used for a tenant who hasn't connected their own via OAuth
    # yet (see MercadoPagoAccountService) — not a hard requirement to keep operating.
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    success-url: ${MERCADOPAGO_SUCCESS_URL:https://example.com/payment/success}
    failure-url: ${MERCADOPAGO_FAILURE_URL:https://example.com/payment/failure}
    pending-url: ${MERCADOPAGO_PENDING_URL:https://example.com/payment/pending}
    # Where a CLIENT's browser lands after paying (or failing to pay) a deposit via Checkout Pro —
    # deliberately separate from success-url/failure-url/pending-url above, which are for the OWNER
    # subscribing to a paid plan (back to the admin panel) via createPreapproval, not a client on the
    # public booking page. No trailing slash — MercadoPagoClient appends /reservar/{tenantSlug}.
    return-base-url: ${MERCADOPAGO_RETURN_BASE_URL:http://localhost:5180}
    # OAuth Connect ("Application" credentials from MercadoPago's developer dashboard — platform-
    # wide, not per-tenant) — used only for the authorization-code exchange itself.
    client-id: ${MERCADOPAGO_CLIENT_ID:}
    client-secret: ${MERCADOPAGO_CLIENT_SECRET:}
    oauth-redirect-uri: ${MERCADOPAGO_OAUTH_REDIRECT_URI:http://localhost:8080/api/mercadopago/oauth/callback}
    # Where a tenant owner's browser lands after connecting (or failing to) — the admin panel.
    connect-return-url: ${MERCADOPAGO_CONNECT_RETURN_URL:http://localhost:5180/tenant}
  twilio:
    # One platform-level WhatsApp sender for every tenant — a tenant only controls whether
    # messages go out (Tenant.whatsappEnabled), not which number they're sent from. Blank
    # defaults are fine at rest: WhatsAppNotificationService catches and logs send failures
    # rather than throwing, so an unconfigured Twilio account never breaks a booking.
    base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    # Twilio WhatsApp sender number, e.g. "+14155238886" (no "whatsapp:" prefix here — added at
    # call time).
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
  whatsapp:
    # Minimum gap between two messages sent to the same client phone number (see
    # WhatsAppNotificationService) — a burst of back-to-back messages reads as spam to Meta's
    # WhatsApp Business quality rating and can get the sending number restricted.
    min-interval-seconds: ${WHATSAPP_MIN_INTERVAL_SECONDS:30}
